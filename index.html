<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Maze Game - Navigate a mouse through a randomly generated maze">
  <title>Maze Game</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Main game container -->
  <div id="game-container">
    <!-- Canvas for maze and player rendering -->
    <canvas id="game-canvas" width="800" height="600"></canvas>

    <!-- UI Overlay -->
    <div id="ui-overlay">
      <!-- Timer display -->
      <div id="timer-display" class="ui-element">
        <span id="timer-text">00:00</span>
      </div>

      <!-- Difficulty selector -->
      <div id="difficulty-selector" class="ui-element">
        <button id="btn-easy" class="difficulty-btn" data-difficulty="easy">Easy</button>
        <button id="btn-medium" class="difficulty-btn active" data-difficulty="medium">Medium</button>
        <button id="btn-hard" class="difficulty-btn" data-difficulty="hard">Hard</button>
      </div>

      <!-- Volume controls -->
      <div id="volume-controls" class="ui-element">
        <label for="volume-slider">Volume:</label>
        <input type="range" id="volume-slider" min="0" max="100" value="70" step="1">
        <button id="mute-toggle" class="control-btn" data-muted="false" aria-label="Mute/Unmute">
          <span class="icon-unmuted">🔊</span>
          <span class="icon-muted hidden">🔇</span>
        </button>
      </div>
    </div>

    <!-- Victory screen (hidden by default) -->
    <div id="victory-screen" class="hidden">
      <div id="fireworks-container"></div>
      <div id="victory-content">
        <h1 id="victory-title">You Won!</h1>
        <p id="victory-time">Time: <span id="final-time">00:00</span></p>
        <button id="play-again-btn" class="action-btn">Play Again</button>
      </div>
    </div>
  </div>

  <!-- Game scripts (ES6 modules) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
